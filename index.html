<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060914">
  <title>System Check</title>
  <meta name="description" content="Interactive web experience">
  <meta property="og:title" content="System Check">
  <meta property="og:description" content="Tap to continue">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kevinnefi-bot.github.io/system-check/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="System Check">
  <meta name="twitter:description" content="Tap to continue">
  <link rel="stylesheet" href="./styles.css?v=final">
  <link rel="stylesheet" href="./bouquet.css?v=final">
  <script src="./flowers.js?v=final" defer></script>
  <script src="./script.js?v=final" defer></script>
</head>
<body>
  <!-- 1. Fake Login Portal -->
  <main id="login" class="login-shell">
    <section class="login-card">
      <div class="brand">
        <span>KN</span>
        <div>
          <b>KN TRAINING</b>
          <small>PERFORMANCE &amp; WELLNESS</small>
        </div>
      </div>
      <p class="overline">PORTAL DE ACCESO</p>
      <h1>SUPERA TU<br><em>PRÓXIMO NIVEL.</em></h1>
      <p class="muted">Ingresa para completar la actividad de experiencia digital.</p>
      <form id="login-form">
        <label for="user">Usuario</label>
        <input id="user" required autocomplete="off" placeholder="Tu usuario...">
        <label for="password">Contraseña</label>
        <input id="password" type="password" required placeholder="••••••••">
        <p id="login-error" role="status"></p>
        <button id="login-button" type="submit">INGRESAR <span>↗</span></button>
      </form>
      <footer>PROYECTO ACADÉMICO · KEVIN NEFI</footer>
    </section>
  </main>

  <!-- 2. Browser Error Simulation -->
  <section id="browser-error" class="browser-error" hidden>
    <div class="browser-error-inner">
      <div class="sad-file">:(</div>
      <h2>No se puede acceder a este sitio</h2>
      <p>Se ha interrumpido la conexión con el servidor.</p>
      <code>ERR_CONNECTION_RESET</code>
      <div>
        <button id="retry" type="button">Volver a cargar</button>
      </div>
    </div>
  </section>

  <!-- 3. Error flood effect container -->
  <div id="error-flood" hidden aria-hidden="true"></div>

  <!-- 4. Interactive Animated Experience Stage -->
  <section id="show" hidden>
    <canvas id="effects" aria-hidden="true"></canvas>
    <button id="sound" hidden aria-label="Control de música" title="Música">♫</button>
    <div id="character" class="character pose-curl" aria-hidden="true"></div>
    <main id="stage">
      <div id="bouquet" hidden aria-label="Ramo digital de colores"></div>
      <div id="message" aria-live="polite"></div>
      <button id="next" hidden>TOCA PARA CONTINUAR <span>→</span></button>
      <button id="replay" hidden>VER OTRA VEZ ↻</button>
    </main>
  </section>

  <!-- Background Music -->
  <audio id="music" src="./audio/musica.mp3" preload="metadata"></audio>
</body>
</html>
